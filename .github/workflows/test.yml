name: Tesseract extraction checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-sin tesseract-ocr-tam
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: OCR_LANGUAGES=eng+sin+tam python kyc_agent.py static/sample-document.png
